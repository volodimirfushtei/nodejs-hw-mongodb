<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Your Password</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f7f9fc;
        margin: 0;
        padding: 0;
        border: 1px solid #aaa;
      }
      .container {
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      .header {
        text-align: center;
        color: #2d81e2;
      }
      .header h1 {
        font-size: 2em;
        margin-bottom: 20px;
      }
      .content {
        color: #333;
        font-size: 1.1em;
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .button {
        display: inline-block;
        background-color: #98bfed;
        color: #fff;
        padding: 12px 20px;
        text-decoration: none;
        font-weight: bold;
        border-radius: 5px;
        margin-top: 20px;
        transition: background-color 0.3s ease;
        cursor: pointer;
      }
      .footer {
        text-align: center;
        font-size: 0.9em;
        color: #aaa;
        margin-top: 30px;
      }
      .footer p {
        margin: 0;
      }
      .footer a {
        color: #1666c1;
        text-decoration: none;
        transition: color 0.3s ease;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <h1>Password Reset Request</h1>
        <p>Hello {{name}},</p>
      </div>

      <div class="content">
        <p>I received a request to reset your password.</p>

        <p><strong>Your reset token:</strong></p>
        <p style="font-weight: bold; color: #333">{{resetToken}}</p>

        <a href="{{link}}" class="button">Reset Your Password</a>
      </div>

      <div class="footer">
        <p>
          If you have some questions, link
          <a href="fuschteyy@gmail.com">contact us</a>.
        </p>
        <p>
          This request was made for your account at
          <strong>Fushtei@com</strong>.
        </p>
      </div>
    </div>
  </body>
</html>
