tags:
  - Contacts
summary: Retrieve all contacts
operationId: getAllContacts
description: 'Retrieve a list of all contacts for the authenticated user'
security:
  - bearerAuth: []
parameters:
  - name: limit
    in: query
    description: 'The maximum number of contacts to retrieve'
    required: false
    schema:
      type: integer
      example: 10
  - name: offset
    in: query
    description: 'The number of contacts to skip for pagination'
    required: false
    schema:
      type: integer
      example: 0
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully found contacts'
            data:
              type: array
              items:
                $ref: '../../components/schemas/contact.yaml'
  '400':
    description: Bad request due to incorrect parameters
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: 'Invalid request parameters'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    description: Internal server error
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 500
            message:
              type: string
              example: 'Error retrieving contacts'
