tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: 'Create a contact provided contact information'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: 'The name of the contact'
            example: 'Messy'
          phoneNumber:
            type: string
            description: 'The phone number of the contact'
            example: '1256445654'
          email:
            type: string
            description: 'The email address of the contact'
            example: 'messy@gmail.com'
          isFavourite:
            type: boolean
            description: 'Whether the contact is marced as a favorite'
            example: false
          contactType:
            type: string
            description: 'The type of contact'
            enum:
              - work
              - home
              - personal
            default: 'personal'
            example: 'personal'
          photo:
            type: string
            description: 'URL of the contacts photo'
            format: binary
responses:
  '201':
    description: Successfully created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact
            data:
              $ref: '../../components/schemas/contact.yaml'
  '400':
    description: 'Bad request: error required fields'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Bad request
            data:
              type: object
              properties:
                message:
                  type: string
                  example: 'Missing required field'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: ../../components/responses/500.yaml
