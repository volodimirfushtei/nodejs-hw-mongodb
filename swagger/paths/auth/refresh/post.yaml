post:
  summary: Refresh a session
  description: Refresh the access token for an existing user by providing email and password.
  operationId: refreshUser
  security:
    - bearerAuth: []
  tags:
    - Authentication
  responses:
    '200':
      description: Successfully refreshed a session!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully refreshed a session!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: 'The new access token for the authenticated user'
    '400':
      description: Bad request - Missing session or refresh token
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Missing session or refresh token'
    '401':
      description: Unauthorized - Invalid session or refresh token
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Session or refresh token is invalid or expired'
    '500':
      $ref: ../../../components/responses/500.yaml
