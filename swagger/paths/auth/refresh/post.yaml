post:
  summary: Refresh a session
  description: Refresh the access token for an existing user by providing email and password.
  operationId: refreshUser
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              description: 'The email of the user'
              example: 'user@example.com'
            password:
              type: string
              description: 'The password of the user'
              example: 'userpassword123'
  responses:
    '200':
      description: Successfully refreshed a session!
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: 'Successfully refreshed a session!'
              data:
                type: object
                required:
                  - accessToken
                properties:
                  accessToken:
                    type: string
                    description: 'The new access token for the authenticated user'
    '400':
      description: Bad request - Missing session or refresh token
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Missing session or refresh token'
    '401':
      description: Unauthorized - Invalid session or refresh token
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Session or refresh token is invalid or expired'
    '500':
      $ref: '../../../components/responses/500.yaml'
