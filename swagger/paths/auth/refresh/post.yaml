post:
  summary: Refresh a session
  description: Refresh the access token for an existing user by providing email and password.
  operationId: refreshUser
  security:
    - bearerAuth: []
  tags:
    - Authentication
  requestBody:
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              description: 'The email address of the user'
              example: 'john.doe@example.com'
            password:
              type: string
              description: 'The password for the user'
              example: 'password123'
  responses:
    '201':
      description: Successfully refreshed the session and access token
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
              - data
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: 'Successfully refreshed a session!'
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    description: 'The new access token for the authenticated user'
                    example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VyX2lkIjoiNjBkMjFiNDY2N2QwZDg5OTJlNjEwYzg1IiwiaWF0IjoxNjY5MTM3Mzg0fQ.Q0iFzN1jm73mjAwbK4qpkT1S0W0McpmuYXeK-Dp1BRM'
    '400':
      description: Bad request - Missing session or refresh token
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: 'Missing session or refresh token'
    '401':
      description: Unauthorized - Invalid session or refresh token
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: 'Session or refresh token is invalid or expired'
    '500':
      $ref: ../../../components/responses/500.yaml
