post:
  tags:
    - Authentication
  summary: Logout the user
  description: Logout the existing user by invalidating their session or removing their authentication tokens.
  operationId: logout
  security:
    - bearerAuth: []
  responses:
    '204':
      description: Successfully logged out the user
      content: {}
    '400':
      description: Bad request - Invalid or missing tokens
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 400
    '401':
      description: Unauthorized - Invalid or expired token
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 401
    '500':
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            required:
              - status
              - message
            properties:
              status:
                type: integer
                example: 500
